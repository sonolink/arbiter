name: Feature Request
description: Suggest an improvement or new capability for Arbiterer
labels: ["idea: new feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to achieve that Arbiterer can't do today?
      placeholder: I want to require verification only for first-time contributors.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would it work? Include workflow YAML if input/output related.
      render: yaml
      placeholder: |
        - uses: owner/arbiterer@v1
          with:
            require-first-time-only: true
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I've checked existing issues and discussions for this request.
          required: true
        - label: This fits Arbiterer's scope.
          required: true
