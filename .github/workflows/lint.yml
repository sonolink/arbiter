name: Lint & Build
on:
    workflow_dispatch:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true
jobs:
    format:
        name: Format (gofmt + goimports)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        if: |
            github.event_name == 'workflow_dispatch' ||
            (github.event.pull_request.head.repo.full_name == github.repository &&
            format('{0}', github.event.pull_request.user.id) != vars.RENOVATE_BOT_ID)
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  ref: ${{ github.head_ref }}

            - name: Set up Go
              uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v6
              with:
                  go-version-file: "go.mod"
                  cache: true

            - name: Install goimports
              run: go install golang.org/x/tools/cmd/goimports@latest

            - name: Run gofmt
              run: gofmt -l -w .

            - name: Run goimports
              run: goimports -l -w .

            - name: Commit and push changes
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  git add -A

                  if ! git diff --cached --quiet; then
                    git commit -m "format(gofmt) [ci skip]"
                    git show HEAD
                    git push
                  else
                    echo "No changes required"
                  fi

    lint-check:
        name: Lint check with golangci-lint
        permissions:
            contents: read
        runs-on: ubuntu-latest
        timeout-minutes: 15
        if: |
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository &&
            format('{0}', github.event.pull_request.user.id) != vars.RENOVATE_BOT_ID
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Set up Go
              uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v6
              with:
                  go-version-file: "go.mod"
                  cache: true

            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@4696ba8babb6127d732c3c6dde519db15edab9d # v8
              with:
                  version: latest

    build:
        name: Build
        permissions:
            contents: read
        runs-on: ubuntu-latest
        timeout-minutes: 15
        if: format('{0}', github.event.pull_request.user.id) != vars.RENOVATE_BOT_ID
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Set up Go
              uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v6
              with:
                  go-version-file: "go.mod"
                  cache: true

            - name: Download dependencies
              run: go mod download

            - name: Build (type-check all packages)
              run: go build ./...
