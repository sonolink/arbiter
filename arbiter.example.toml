[server]
addr = ":8080"

# Create an app at https://discord.com/developers/applications and add a
# redirect to the `redirect_uri` below under "OAuth2 -> Redirects".
[discord]
client_id = "your-discord-client-id"
client_secret = "your-discord-client-secret"
redirect_uri = "http://localhost:8080/callback"

[database]
# Either set `url` to a full postgres:// DSN, or fill in the individual fields.
# url = "postgres://user:pass@localhost:5432/arbiter"
host = "localhost"
port = 5432
user = "postgres"
password = ""
database = "arbiter"
sslmode = "disable"  # libpq sslmode (disable, require, prefer, verify-ca, verify-full)
